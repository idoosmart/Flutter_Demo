group 'com.idosmart.bluetooth'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.8.10'
    repositories {
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        maven { url 'https://jitpack.io' }
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/nexus/content/groups/public/' }
        maven { url 'https://jitpack.io' }
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Flutter path / 日常开发：implementation；Native AAR 打包：compileOnly（build_sdk 传 idoSdkPackaging）
def idoSdkPackaging = (findProperty('idoSdkPackaging') ?: 'false').toString().toBoolean()
def nordicDfuDep = 'no.nordicsemi.android:dfu:2.5.0'
logger.lifecycle("[bluetooth_sdk] idoSdkPackaging=${idoSdkPackaging} → ${idoSdkPackaging ? 'compileOnly' : 'implementation'} ${nordicDfuDep}")

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.idosmart.bluetooth'
    }
    compileSdkVersion 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 23
        consumerProguardFiles "consumer-rules.pro"
    }
    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    api fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'com.google.code.gson:gson:2.9.1'
    // Nordic Legacy/Secure DFU：见文件顶部 idoSdkPackaging；R8 规则见 consumer-rules.pro
    if (idoSdkPackaging) {
        compileOnly nordicDfuDep
    } else {
        implementation nordicDfuDep
    }
}
