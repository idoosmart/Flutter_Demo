// The Android Gradle Plugin builds the native code with the Android NDK.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// NDK r28 起 arm64-v8a / x86_64 默认按 16 KB 页面对齐，满足 Google Play 的 16 KB 兼容要求。
// 注意：本模块被 `flutter build aar` 编译时，rootProject 是 protocol_native/.android，
// 那里的 local.properties 不含 ndk.version，因此以下默认值就是实际生效的版本。
def  ndkversion= localProperties.getProperty('ndk.version')
if (ndkversion == null) {
    ndkversion = '28.2.13676358'
}

group 'com.idosmart.protocol_ffi'
version '1.0'

buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        mavenLocal()
        mavenCentral()
        google()
        maven { url "https://jitpack.io" }
        jcenter(){ url "https://jcenter.bintray.com/"}
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:7.2.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    compileSdkVersion 31

    // Bumping the plugin ndkVersion requires all clients of this plugin to bump
    // the version in their app and to download a newer version of the NDK.
    ndkVersion ndkversion

    //设置so库路径
    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            // NDK r23 起需 CMake 3.21+ 才启用新版 android.toolchain.cmake
            version "3.22.1"
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    defaultConfig {
        // NDK r27 起不再支持 API 21 以下
        minSdkVersion 21
        // Invoke the shared CMake build with the Android Gradle Plugin.
        externalNativeBuild {
            cmake {
                cppFlags "-fexceptions -std=c++14 -DSPDLOG_FMT_PRINTF -DPLATFORM_TYPE=1" //使用异常
                cFlags "-DPLATFORM_TYPE=1" //定义 平台类型 android


                //遇到编译错误 找不到string
//                arguments "-DANDROID_STL=c++_static"

//            abiFilters "armeabi"     //ndk 17及以上版本被取消
            abiFilters "armeabi-v7a"
            abiFilters "arm64-v8a"
//                abiFilters "x86"
//                abiFilters "x86_64"
            }
        }
    }
}
