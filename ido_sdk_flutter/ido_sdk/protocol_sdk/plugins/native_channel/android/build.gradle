group 'com.idosmart.native_channel'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '1.7.10'
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://www.jitpack.io' }
        google()
        jcenter()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://www.jitpack.io' }
        google()
        jcenter()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

// Flutter path / 日常开发：implementation；Native AAR 打包：compileOnly（build_sdk 传 idoSdkPackaging）
def idoSdkPackaging = (findProperty('idoSdkPackaging') ?: 'false').toString().toBoolean()
def mcumgrBleDep = 'no.nordicsemi.android:mcumgr-ble:1.5.2'
logger.lifecycle("[native_channel] idoSdkPackaging=${idoSdkPackaging} → ${idoSdkPackaging ? 'compileOnly' : 'implementation'} ${mcumgrBleDep}")

android {
    compileSdkVersion 33

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            java.srcDirs += 'src/main/kotlin'
        }
    }

    defaultConfig {
        minSdkVersion 16
        // 下发给接入方：打包 AAR 时 mcumgr 为 compileOnly，需 keep + dontwarn（见 consumer-rules.pro）
        consumerProguardFiles "consumer-rules.pro"
    }

    // 以下资源仅用于内部标准化项目（不要修改此处代码）
    libraryVariants.configureEach { variant ->
        variant.mergeAssets.doLast {
            delete fileTree(dir: variant.getMergeAssets().getOutputDir(), includes: [
                    '**/com.tencent.mm.png.bak',
                    '**/com.tencent.mobileqq.png.bak'
            ])
        }
    }

    dependencies {
        implementation fileTree(include: ['*.jar'], dir: 'libs')
        testImplementation 'org.jetbrains.kotlin:kotlin-test'
        testImplementation 'org.mockito:mockito-core:5.0.0'
        implementation 'commons-fileupload:commons-fileupload:1.3.1'
        implementation group: 'commons-io', name: 'commons-io', version: '2.5'
        implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
        implementation 'androidx.core:core:1.12.0'
        implementation 'com.squareup.okhttp3:okhttp:3.14.9'
        implementation 'com.squareup.okio:okio:1.17.2'
        // Zephyr / MCUmgr：见文件顶部 idoSdkPackaging；R8 规则见 consumer-rules.pro
        if (idoSdkPackaging) {
            compileOnly mcumgrBleDep
        } else {
            implementation mcumgrBleDep
        }
        implementation 'com.google.code.gson:gson:2.8.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
    buildToolsVersion '33.0.0'
}
